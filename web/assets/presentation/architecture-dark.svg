<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" data-palette="56e6cc-6abbe7-acf6cd-6070df6b75fb" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc"><title id="architecture-dark-title">AttestLoad architecture</title><desc id="architecture-dark-desc">Directory facts feed a policy-controlled load check</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="570"><stop stop-color="#56e6cc"/><stop offset=".6" stop-color="#6abbe7"/><stop offset="1" stop-color="#acf6cd"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e6cc" stop-opacity=".22"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c3a" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6cc" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="570" rx="16" fill="#050c11"/><rect width="1000" height="570" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="245.1" rx="500.0" ry="399.0" fill="url(#halo)"/><text x="44" y="44" fill="#95b9bf" font-size="13" text-anchor="start" font-weight="400">ARCHITECTURE / DATA FLOW</text><text x="44" y="84.0" fill="#eefdf5" font-size="30" text-anchor="start" font-weight="400">Directory facts feed a policy-controlled load check</text><path d="M320 203H360" fill="none" stroke="#56e6cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 203H360" class="flow" fill="none" stroke="#acf6cd" stroke-width="2"/><path d="M636 203H676" fill="none" stroke="#56e6cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M636 203H676" class="flow" fill="none" stroke="#acf6cd" stroke-width="2"/><path d="M814.0 264V334.0H182.0V372" fill="none" stroke="#56e6cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M814.0 264V334.0H182.0V372" class="flow" fill="none" stroke="#acf6cd" stroke-width="2"/><path d="M320 433H360" fill="none" stroke="#56e6cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 433H360" class="flow" fill="none" stroke="#acf6cd" stroke-width="2"/><rect x="44" y="142" width="276" height="122" rx="12" fill="#0c171d" stroke="#173c3a"/><text x="62" y="173.0" fill="#eefdf5" font-size="21" text-anchor="start" font-weight="400">Directory manifest</text><text x="62" y="225.0" fill="#95b9bf" font-size="17" text-anchor="start" font-weight="400">files, modes and</text><text x="62" y="248.8" fill="#95b9bf" font-size="17" text-anchor="start" font-weight="400">symlinks</text><rect x="360" y="142" width="276" height="122" rx="12" fill="#0c171d" stroke="#173c3a"/><text x="378" y="173.0" fill="#eefdf5" font-size="21" text-anchor="start" font-weight="400">SBOM + provenance</text><text x="378" y="225.0" fill="#95b9bf" font-size="17" text-anchor="start" font-weight="400">file or lockfile</text><text x="378" y="248.8" fill="#95b9bf" font-size="17" text-anchor="start" font-weight="400">metadata</text><rect x="676" y="142" width="276" height="122" rx="12" fill="#0c171d" stroke="#173c3a"/><text x="694" y="173.0" fill="#eefdf5" font-size="21" text-anchor="start" font-weight="400">Signature</text><text x="694" y="225.0" fill="#95b9bf" font-size="17" text-anchor="start" font-weight="400">