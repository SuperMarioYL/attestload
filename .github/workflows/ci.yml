name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: README release-badge drift guard
        run: |
          if grep -nE 'img\.shields\.io/badge/release-v[0-9]' README.md README.en.md; then
            echo "ERROR: a hardcoded static release-vX.Y.Z badge was found in a README."
            echo "Use the dynamic github/v/release badge instead so the version tracks the real release tag."
            exit 1
          fi
          echo "OK: no hardcoded static release badge in READMEs."
      - name: Version-files drift guard
        run: |
          # package.json and VERSION are two version sources; they must never
          # drift apart. The publish flow tags from the --version flag, so if
          # the files aren't bumped to match, `attestload --version` lies about
          # the shipped release (it read 0.10.0 on a v0.11.0 release).
          PKG="$(node -p "require('./package.json').version")"
          VER="$(tr -d ' \n' < VERSION 2>/dev/null)"
          if [ "$PKG" != "$VER" ]; then
            echo "ERROR: package.json version ($PKG) != VERSION file ($VER)."
            echo "Bump both version sources together so they track the release tag."
            exit 1
          fi
          # Best-effort tag-sync: the latest tag should match package.json too.
          # Skips gracefully when no tag is reachable on a shallow CI clone; the
          # file-vs-file check above is the robust primary guard.
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LATEST" ]; then
            TAG="${LATEST#v}"
            if [ "$PKG" != "$TAG" ]; then
              echo "ERROR: package.json version ($PKG) != latest tag ($LATEST)."
              echo "Bump the version files before tagging the release."
              exit 1
            fi
          fi
          echo "OK: version files agree ($PKG)."
      - name: Site content-version drift guard
        run: |
          # web/site.json meta.content_version is the version surface the live
          # Pages site advertises. It shipped v0.11.0 on a v0.12.0 release
          # (the publish flow bumped package.json/VERSION but not the site),
          # the same truthful-reporting drift the guards above close for the
          # other surfaces. Assert it (minus the leading v) equals package.json
          # so a future release that tags without bumping the site version
          # fails CI.
          PKG="$(node -p "require('./package.json').version")"
          SITE="$(node -p "require('./web/site.json').meta.content_version" 2>/dev/null || true)"
          if [ -z "$SITE" ]; then
            echo "WARN: web/site.json meta.content_version not found; skipping."
          else
            SITE_NUM="${SITE#v}"
            if [ "$PKG" != "$SITE_NUM" ]; then
              echo "ERROR: web/site.json meta.content_version ($SITE) != package.json version ($PKG)."
              echo "Bump web/site.json meta.content_version before tagging the release."
              exit 1
            fi
            echo "OK: site content_version agrees ($SITE)."
          fi
